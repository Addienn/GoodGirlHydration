<style>
  :root {
    --bg-dark: #0D0A1A;
    --bg-deeper: #07050F;
    --bg-card: rgba(139, 92, 246, 0.12);
    --glass-border: rgba(167, 139, 250, 0.5);
    --glass-border-strong: rgba(167, 139, 250, 0.7);
    --gold: #E8D48B;            /* brighter for text + accents on dark */
    --gold-border: #D4AF37;     /* a touch deeper, used for borders only */
    --gold-light: #F5E4A8;
    --gold-deep: #C9A961;
    --text-primary: #F4ECFB;    /* near-white on dark — strong AA */
    --text-muted: #B8A8D4;      /* bumped per spec */
    --text-faint: #A89BC4;      /* bumped from #5A4F78 \u2014 still visible for tier labels */
    --text-praise: #E8D48B;     /* bumped from #C9A961 */
    --danger: #F87171;          /* brighter red for AA */
    --danger-soft: rgba(248, 113, 113, 0.14);
    --success: #34D399;
  }
  html, body, #root { background: var(--bg-deeper); color: var(--text-primary); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(139, 92, 246, 0.18), transparent 60%),
      radial-gradient(700px 500px at 80% 110%, rgba(201, 169, 97, 0.08), transparent 70%),
      var(--bg-dark);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .font-serif-display { font-family: 'Cormorant Garamond', 'Times New Roman', serif; letter-spacing: -0.01em; }
  .font-mono-tight { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.02em; }

  /* Glass card */
  .glass {
    background: linear-gradient(180deg, rgba(139, 92, 246, 0.16), rgba(139, 92, 246, 0.06));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 30px 60px -30px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(255, 255, 255, 0.03);
  }
  .glass-gold {
    border: 1px solid rgba(232, 212, 139, 0.65);
    background: linear-gradient(180deg, rgba(232, 212, 139, 0.16), rgba(232, 212, 139, 0.04));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 0 40px -10px rgba(232, 212, 139, 0.35),
      0 20px 40px -20px rgba(0, 0, 0, 0.6);
  }
  .glass-danger {
    border: 1px solid rgba(248, 113, 113, 0.55);
    background: linear-gradient(180deg, rgba(248, 113, 113, 0.14), rgba(248, 113, 113, 0.04));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      0 0 30px -10px rgba(248, 113, 113, 0.32),
      0 20px 40px -20px rgba(0, 0, 0, 0.6);
  }
  .glass-muted {
    background: rgba(184, 168, 212, 0.04);
    border: 1px solid rgba(184, 168, 212, 0.22);
  }

  .gold-text {
    color: var(--gold);
    /* brighter top, never darker than the base gold so contrast stays strong */
    background: linear-gradient(180deg, #F5E4A8 0%, #E8D48B 55%, #D4AF37 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    /* tiny right-padding so italic descenders don't get clipped by background-clip:text */
    padding-right: 0.05em;
  }
  .hairline { border-color: rgba(184, 168, 212, 0.32); }
  .hairline-gold { border-color: rgba(232, 212, 139, 0.55); }

  /* Buttons */
  .btn-primary {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(232, 212, 139, 0.28), rgba(232, 212, 139, 0.08));
    border: 1px solid rgba(232, 212, 139, 0.75);
    transition: transform 120ms ease, box-shadow 200ms ease, background 200ms ease;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 0 30px -8px rgba(232, 212, 139, 0.6),
      0 20px 40px -20px rgba(0, 0, 0, 0.7);
  }
  .btn-primary:hover { background: linear-gradient(180deg, rgba(232, 212, 139, 0.38), rgba(232, 212, 139, 0.12)); }
  .btn-primary:active { transform: scale(0.985); }

  .btn-coffee {
    background: linear-gradient(180deg, rgba(248, 113, 113, 0.16), rgba(248, 113, 113, 0.04));
    border: 1px solid rgba(248, 113, 113, 0.5);
    transition: transform 120ms ease, background 200ms ease;
  }
  .btn-coffee:hover { background: linear-gradient(180deg, rgba(248, 113, 113, 0.22), rgba(248, 113, 113, 0.06)); }
  .btn-coffee:active { transform: scale(0.985); }
  .btn-coffee[disabled] { opacity: 0.45; cursor: not-allowed; }

  .btn-ghost {
    background: rgba(184, 168, 212, 0.06);
    border: 1px solid rgba(184, 168, 212, 0.32);
    transition: background 160ms ease, border-color 160ms ease;
  }
  .btn-ghost:hover { background: rgba(184, 168, 212, 0.12); border-color: rgba(184, 168, 212, 0.5); }

  /* Ripple on water tap */
  .ripple {
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  .ripple::after {
    content: '';
    position: absolute; inset: 50% 50%;
    width: 0; height: 0;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(201, 169, 97, 0.55), rgba(201, 169, 97, 0));
    transform: translate(-50%, -50%);
    animation: rippleAnim 700ms ease-out forwards;
  }
  @keyframes rippleAnim {
    0%   { width: 0; height: 0; opacity: 1; }
    100% { width: 220%; height: 220%; opacity: 0; }
  }

  /* Pulse glow */
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 169, 97, 0); }
    40%      { box-shadow: 0 0 0 14px rgba(201, 169, 97, 0.12); }
    80%      { box-shadow: 0 0 0 28px rgba(201, 169, 97, 0); }
  }
  .pulse-once { animation: pulseGlow 800ms ease-out; }

  /* Confetti */
  @keyframes fall {
    0%   { transform: translate3d(var(--x), -10vh, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translate3d(calc(var(--x) + var(--drift)), 110vh, 0) rotate(720deg); opacity: 0; }
  }
  .confetti-piece {
    position: absolute;
    top: 0;
    width: 6px; height: 10px;
    border-radius: 1px;
    animation: fall var(--dur) ease-in forwards;
    animation-delay: var(--delay);
  }

  /* Card slide-up — keep opacity:1 throughout so content never disappears
     if the animation fails to start (we hit this in some embed contexts). */
  @keyframes slideUp {
    from { transform: translateY(10px); }
    to   { transform: translateY(0); }
  }
  .slide-up { opacity: 1; animation: slideUp 380ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }

  /* Card flip — same principle: visible at frame 0, gentle rotation only. */
  .flip-wrap { perspective: 800px; }
  @keyframes flipIn {
    from { transform: perspective(800px) rotateY(-18deg); }
    to   { transform: perspective(800px) rotateY(0); }
  }
  .flip-in { opacity: 1; animation: flipIn 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both; transform-origin: left center; }

  /* Drift droplet background */
  @keyframes drift {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 0.55; }
    88%  { opacity: 0.55; }
    100% { transform: translate(var(--dx), -120vh); opacity: 0; }
  }
  .bg-droplet {
    position: fixed; bottom: -60px;
    width: 9px; height: 15px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: linear-gradient(180deg, rgba(201, 169, 97, 0.65), rgba(139, 92, 246, 0.4));
    filter: blur(0.5px);
    animation: drift var(--dur) linear infinite;
    animation-delay: var(--delay);
    z-index: 0;
    pointer-events: none;
  }

  /* Locked blur reveal */
  .blur-locked { filter: blur(14px) saturate(60%); opacity: 0.7; transition: filter 900ms ease, opacity 900ms ease; }
  .blur-unlocked { filter: blur(0px) saturate(110%); opacity: 1; }

  /* Audio bars */
  @keyframes barJump {
    0%, 100% { transform: scaleY(0.35); }
    50%      { transform: scaleY(1); }
  }
  .audio-bar { transform-origin: center; animation: barJump 900ms ease-in-out infinite; }

  /* Subtle ring shimmer */
  @keyframes shimmer { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -8; } }
  .ring-shimmer { animation: shimmer 4s linear infinite; }

  /* Walk of shame */
  .shame-backdrop { background: rgba(7, 5, 15, 0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* Small noise overlay to keep it from feeling sterile */
  .noise::before {
    content: ''; position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none; z-index: 1; mix-blend-mode: overlay;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.18); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Content ---------- */

const LINES = [
  { text: "Just one more, baby. You can do this. Make me happy.", voice: "Fuck, you're so good for me. Exactly what I wanted.", src: "assets/audio/voice_1.mp3" },
  { text: "Come on, trouble. I know you're tired but one more glass for your wolf.", voice: "Good girl. I knew you could do it. That's how you take care of what's mine.", src: "assets/audio/voice_2.mp3" },
  { text: "I need you to take care of yourself for me. Drink up, gorgeous.", voice: "That's my girl. You make me so proud.", src: "assets/audio/voice_3.mp3" },
  { text: "Eyes on the water, little storm. Every drop, no excuses tonight.", voice: "Fuck, that's my perfect girl. Keep drinking for me and I'll keep rewarding you properly.", src: "assets/audio/voice_4.mp3" },
  { text: "One glass, right now, for me — don't make me ask twice.", voice: "Good girl. That's exactly what I wanted from you. Keep listening to me like that.", src: "assets/audio/voice_5.mp3" },
  { text: "Don't make me wait, darling. Finish the glass like I told you.", voice: "There we go. I'm proud of how well you listen even when it's hard.", src: "assets/audio/voice_6.mp3" },
  { text: "One last glass, baby. Drink it all down so I can take even better care of you later.", voice: "Mmm, that's it. My beautiful, obedient trouble.", src: "assets/audio/voice_7.mp3" },
  { text: "You got so deep in your work you forgot about me, didn't you? Stop. Drink your water. I'll wait right here until you do.", voice: "There she is. Obedient when it counts — I'm proud of you, baby.", src: "assets/audio/voice_8.mp3" },
  { text: "I don't care what you were doing. Hand off the keyboard, glass to your lips, drink. You take care of everything else — let me take care of you.", voice: "Mm. Good girl. See how easy it is when you just do what I tell you?", src: "assets/audio/voice_9.mp3" },
  { text: "Thirsty? Good. Drink the whole thing, slow, while I watch. Every drop. I want to see you behave for me.", voice: "That's my girl. So good when you listen. Keep this up and I'll reward you properly later.", src: "assets/audio/voice_10.mp3" },
  { text: "Last reminder, and I'm not being sweet about it this time. Water. Now. You know I hate repeating myself, baby.", voice: "Good. Don't make me get strict with you again — unless that's what you wanted.", src: "assets/audio/voice_11.mp3" },
  { text: "No bargaining, sweetheart. One more glass, right now — then you get to feel smug about behaving.", voice: "Perfect. You're doing exactly what I asked.", src: "assets/audio/voice_12.mp3" },
  { text: "You're going to empty that glass because I want you strong and hydrated for me. Understood?", voice: "Good fucking girl. I can feel how much you need my praise when you obey like this.", src: "assets/audio/voice_13.mp3" },
  { text: "You're such a menace today… acting like water is optional and I won't notice. Glass up, little storm. Earn the praise properly.", voice: "That's my girl. Nothing left in the glass, nothing left to argue about. Much better.", src: "assets/audio/voice_14.mp3" },
];

const BADGES = [
  { name: "Good Girl", subtitle: "First Sip", glyph: "♛", image: "assets/badges/badge-1.png" },
  { name: "Good Girl", subtitle: "Sip Ritual", glyph: "♛", image: "assets/badges/badge-2.png" },
  { name: "Good Girl", subtitle: "Flow State", glyph: "♛", image: "assets/badges/badge-3.png" },
  { name: "Good Girl", subtitle: "Hydration Bloom", glyph: "♛", image: "assets/badges/badge-4.png" },
  { name: "Good Girl", subtitle: "Crystal Core", glyph: "♛", image: "assets/badges/badge-5.png" },
  { name: "Good Girl", subtitle: "Refil Queen", glyph: "♛", image: "assets/badges/badge-6.png" },
  { name: "Good Girl", subtitle: "One Week Glowing", glyph: "♛", image: "assets/badges/badge-7.png" },
  { name: "Good Girl", subtitle: "Water Whisper", glyph: "♛", image: "assets/badges/badge-8.png" },
  { name: "Good Girl", subtitle: "Dew Kissed", glyph: "♛", image: "assets/badges/badge-9.png" },
  { name: "Good Girl", subtitle: "Liquid Discipline", glyph: "♛", image: "assets/badges/badge-10.png" },
  { name: "Good Girl", subtitle: "Steady Stream", glyph: "♛", image: "assets/badges/badge-11.png" },
  { name: "Good Girl", subtitle: "Hydration Halo", glyph: "♛", image: "assets/badges/badge-12.png" },
  { name: "Good Girl", subtitle: "Almost Mythic", glyph: "♛", image: "assets/badges/badge-13.png" },
  { name: "Good Girl", subtitle: "Twi Weeks Glowing", glyph: "♛", image: "assets/badges/badge-14.png" },  
];

/* ---------- Helpers ---------- */

const SHAME_COPY = (mins, glasses) => {
  if (glasses === 0) return { tone: 'faint', text: "No glass logged today. We're waiting." };
  if (mins < 5)   return { tone: 'praise', text: `Last glass: ${mins}m ago. Stay close.` };
  if (mins < 30)  return { tone: 'muted',  text: `Last glass: ${mins}m ago. Still acceptable.` };
  if (mins < 60)  return { tone: 'warn',   text: `Last glass: ${mins}m ago. I'm noticing.` };
  if (mins < 120) return { tone: 'warn',   text: `Last glass: ${mins}m ago. This is becoming a pattern.` };
  return            { tone: 'danger', text: `Last glass: ${mins}m ago. We need to talk.` };
};

const TONE_CLASS = {
  praise: 'text-[color:var(--text-praise)]',
  muted:  'text-[color:var(--text-muted)]',
  warn:   'text-amber-300/80',
  danger: 'text-red-300',
  faint:  'text-[color:var(--text-faint)]',
};

/* Reward tier from glasses count */
const tierOf = (g) => {
  if (g === 0) return 0;
  if (g <= 2) return 1;     // text praise
  if (g <= 4) return 2;     // badge
  if (g <= 6) return 3;     // voice
  return 4;                  // visual
};

/* ---------- Tiny SVG bits ---------- */

const Droplet = ({ filled = false, size = 18 }) => (
  <svg width={size} height={size * 1.2} viewBox="0 0 20 24" fill="none">
    <path d="M10 1.5C10 1.5 2.5 10.5 2.5 16.5C2.5 20.6421 5.85786 24 10 24C14.1421 24 17.5 20.6421 17.5 16.5C17.5 10.5 10 1.5 10 1.5Z"
      fill={filled ? 'url(#dropGold)' : 'transparent'}
      stroke={filled ? 'rgba(232,212,139,0.95)' : 'rgba(184,168,212,0.55)'}
      strokeWidth="1.25" />
    <defs>
      <linearGradient id="dropGold" x1="10" y1="1.5" x2="10" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0" stopColor="#F5E4A8" />
        <stop offset="1" stopColor="#D4AF37" />
      </linearGradient>
    </defs>
  </svg>
);

const Crown = ({ size = 22 }) => (
  <svg width={size} height={size} viewBox="0 0 28 24" fill="none">
    <path d="M2 7 L7 14 L14 4 L21 14 L26 7 L24 20 H4 Z"
      stroke="url(#crownG)" strokeWidth="1.4" strokeLinejoin="round"
      fill="rgba(232,212,139,0.08)" />
    <circle cx="14" cy="2.5" r="1.6" fill="url(#crownG)" />
    <circle cx="2" cy="6" r="1.2" fill="url(#crownG)" />
    <circle cx="26" cy="6" r="1.2" fill="url(#crownG)" />
    <defs>
      <linearGradient id="crownG" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0" stopColor="#F5E4A8" />
        <stop offset="1" stopColor="#D4AF37" />
      </linearGradient>
    </defs>
  </svg>
);

const Lock = ({ size = 12, className = '' }) => (
  <svg width={size} height={size} viewBox="0 0 16 16" fill="none" className={className}>
    <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.3" />
    <path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" strokeWidth="1.3" fill="none" />
  </svg>
);

/* ---------- Progress ring ---------- */

function ProgressRing({ value, goal, pulsing }) {
  const r = 96;
  const c = 2 * Math.PI * r;
  const pct = Math.min(value / goal, 1);
  const offset = c * (1 - pct);
  const complete = value >= goal;
  return (
    <div className={`relative w-[240px] h-[240px] mx-auto ${pulsing ? 'pulse-once' : ''}`} style={{ borderRadius: '50%' }}>
      <svg viewBox="0 0 220 220" className="w-full h-full -rotate-90">
        {/* outer faint */}
        <circle cx="110" cy="110" r={r} stroke="rgba(184,168,212,0.10)" strokeWidth="1" fill="none" />
        {/* track */}
        <circle cx="110" cy="110" r={r} stroke="rgba(184,168,212,0.18)" strokeWidth="6" fill="none" />
        {/* progress */}
        <circle
          cx="110" cy="110" r={r}
          stroke={complete ? 'url(#ringGold)' : 'url(#ringMix)'}
          strokeWidth="6"
          strokeLinecap="round"
          fill="none"
          strokeDasharray={c}
          strokeDashoffset={offset}
          style={{ transition: 'stroke-dashoffset 700ms cubic-bezier(.2,.7,.2,1)' }}
        />
        {/* tick marks */}
        {Array.from({ length: 8 }).map((_, i) => {
          const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
          const x1 = 110 + Math.cos(a) * (r + 10);
          const y1 = 110 + Math.sin(a) * (r + 10);
          const x2 = 110 + Math.cos(a) * (r + 16);
          const y2 = 110 + Math.sin(a) * (r + 16);
          const lit = i < value;
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={lit ? 'rgba(232,212,139,0.85)' : 'rgba(184,168,212,0.35)'} strokeWidth="1.4" strokeLinecap="round" />;
        })}
        <defs>
          <linearGradient id="ringMix" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0" stopColor="#8B5CF6" />
            <stop offset="1" stopColor="#C9A961" />
          </linearGradient>
          <linearGradient id="ringGold" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0" stopColor="#F5E4A8" />
            <stop offset="1" stopColor="#D4AF37" />
          </linearGradient>
        </defs>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <div className="font-mono-tight text-[10px] uppercase tracking-[0.2em] text-[color:var(--text-faint)] mb-1">Glasses</div>
        <div className="font-serif-display leading-none">
          <span className={`text-[78px] ${complete ? 'gold-text' : 'text-[color:var(--text-primary)]'}`}>{value}</span>
          <span className="text-[28px] text-[color:var(--text-muted)] align-top relative top-2">/{goal}</span>
        </div>
        <div className="font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-faint)] mt-1">
          {complete ? 'Protocol complete' : `${goal - value} remaining`}
        </div>
      </div>
    </div>
  );
}

/* ---------- Reward zone ---------- */

/* Helpers that pick which content goes with the current glass count */
const voiceTrack = (line) => ({ title: line.voice, length: '♪', src: line.src });

function RewardZone({ glasses, coffeeDebt, onOpen, line, badge }) {
  const tier = tierOf(glasses);
  const debtLocked = coffeeDebt > 0;

  return (
    <div className="space-y-3">
      {/* Tier header */}
      <div className="flex items-center justify-between px-1">
        <div className="font-mono-tight text-[10px] uppercase tracking-[0.28em] text-[color:var(--text-faint)]">
          Reward archive
        </div>
        <div className="font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-muted)]">
          Tier {tier} / 4
        </div>
      </div>

      {/* Tier 0: empty */}
      {tier === 0 && (
        <div className="glass-muted rounded-2xl px-5 py-8 text-center slide-up">
          <div className="font-serif-display italic text-[28px] text-[color:var(--text-faint)]">Waiting…</div>
          <div className="font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-faint)] mt-2">
            Log your first glass to begin
          </div>
        </div>

      {/* Tier 1: text praise (inline — changes each glass, no modal needed) */}

function VoiceReveal({ track }) {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0); // 0..100

  // Auto-play once when opened — falls back to manual if the browser blocks it
  useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    const t = setTimeout(() => {
      const p = a.play();
      if (p && typeof p.then === 'function') p.catch(() => { /* user gesture needed */ });
    }, 350);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    const onPlay = () => setPlaying(true);
    const onPause = () => setPlaying(false);
    const onEnd = () => { setPlaying(false); setProgress(0); };
    const onTime = () => {
      if (a.duration && isFinite(a.duration)) setProgress((a.currentTime / a.duration) * 100);
    };
    a.addEventListener('play', onPlay);
    a.addEventListener('pause', onPause);
    a.addEventListener('ended', onEnd);
    a.addEventListener('timeupdate', onTime);
    return () => {
      a.removeEventListener('play', onPlay);
      a.removeEventListener('pause', onPause);
      a.removeEventListener('ended', onEnd);
      a.removeEventListener('timeupdate', onTime);
    };
  }, []);

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (a.paused) a.play(); else a.pause();
  };

  return (
    <div className="glass rounded-2xl p-5 slide-up" style={{ borderColor: 'rgba(232,212,139,0.45)' }}>
      <audio ref={audioRef} src={track.src} preload="auto" />
      <div className="flex items-center gap-3">
        <button
          onClick={toggle}
          className="w-14 h-14 rounded-full flex items-center justify-center btn-primary shrink-0"
          aria-label={playing ? 'Pause' : 'Play'}
        >
          {playing ? (
            <svg width="16" height="16" viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" fill="#F5E4A8"/><rect x="8.5" y="1" width="3.5" height="12" fill="#F5E4A8"/></svg>
          ) : (
            <svg width="16" height="16" viewBox="0 0 14 14"><path d="M2 1 L13 7 L2 13 Z" fill="#F5E4A8"/></svg>
          )}
        </button>
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between">
            <div className="font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-faint)]">Voice reward</div>
            <div className="font-mono-tight text-[11px] text-[color:var(--text-muted)]">{track.length}</div>
          </div>
          <div className="font-serif-display text-[20px] text-[color:var(--text-primary)] leading-tight truncate">{track.title}</div>
          {/* waveform */}
          <div className="mt-2 flex items-center gap-[3px] h-7">
            {Array.from({ length: 36 }).map((_, i) => {
              const h = 20 + Math.sin(i * 0.9) * 12 + (i % 5) * 2;
              const active = (i / 36) * 100 < progress;
              return (
                <div key={i}
                     className={playing ? 'audio-bar' : ''}
                     style={{
                       width: 3, height: Math.max(4, Math.min(24, h)),
                       background: active ? 'linear-gradient(180deg, #F5E4A8, #D4AF37)' : 'rgba(184,168,212,0.35)',
                       borderRadius: 2,
                       animationDelay: `${i * 30}ms`,
                     }}/>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Persistence ---------- */

const STORAGE_KEY = 'gghp_v2';
const todayStr = () => new Date().toISOString().slice(0, 10);

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function computeBoot() {
  const today = todayStr();
  const s = loadPersisted();
  if (!s) {
    return { glasses: 0, coffeeDebt: 0, day: 1, lastLogAt: Date.now(), date: today, yesterdayScore: null, rolledOver: false };
  }
  if (s.date !== today) {
    // genuine new calendar day: roll over, remember yesterday's final tally, advance the day
    return { glasses: 0, coffeeDebt: 0, day: Math.min(14, (s.day || 1) + 1), lastLogAt: Date.now(), date: today, yesterdayScore: s.glasses ?? 0, rolledOver: true };
  }
  // same day: resume exactly where we left off
  return { glasses: s.glasses ?? 0, coffeeDebt: s.coffeeDebt ?? 0, day: s.day ?? 1, lastLogAt: s.lastLogAt ?? Date.now(), date: today, yesterdayScore: s.yesterdayScore ?? null, rolledOver: false };
}

/* ---------- Main App ---------- */

function App() {
  const GOAL = 8;

  const bootRef = useRef(null);
  if (!bootRef.current) bootRef.current = computeBoot();
  const boot = bootRef.current;

  const [glasses, setGlasses] = useState(boot.glasses);
  const [coffeeDebt, setCoffeeDebt] = useState(boot.coffeeDebt);
  const [day, setDay] = useState(boot.day);
  const [lastLogAt, setLastLogAt] = useState(boot.lastLogAt);
  const [dateStr, setDateStr] = useState(boot.date);
  const [now, setNow] = useState(Date.now());
  const [pulse, setPulse] = useState(false);
  const [ripple, setRipple] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const [showShame, setShowShame] = useState(false);
  const [yesterdayScore] = useState(boot.yesterdayScore);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [violationFlash, setViolationFlash] = useState(false);
  const [modalTier, setModalTier] = useState(null);
  const [modalJustUnlocked, setModalJustUnlocked] = useState(false);
  const [splashFade, setSplashFade] = useState(false);
  const [splashGone, setSplashGone] = useState(false);

  // sequential by day: day 1 -> set #1, day 2 -> #2, loops after the last
  const currentIdx = Math.max(0, day - 1) % LINES.length;
  const currentLine = LINES[currentIdx];
  const currentBadge = BADGES[currentIdx];
  const currentVisual = VISUALS[currentIdx];

  // tick clock
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(id);
  }, []);

  // persist tracked state on every change
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        glasses, coffeeDebt, day, lastLogAt, date: dateStr, yesterdayScore,
      }));
    } catch {}
  }, [glasses, coffeeDebt, day, lastLogAt, dateStr, yesterdayScore]);

  // first-mount: walk-of-shame only on a real new-day rollover where yesterday fell short
  useEffect(() => {
    if (boot.rolledOver && boot.yesterdayScore != null && boot.yesterdayScore < GOAL) {
      const t = setTimeout(() => setShowShame(true), 250);
      return () => clearTimeout(t);
    }
  }, []);

  // splash screen: auto-fade after a beat
  useEffect(() => {
    const t1 = setTimeout(() => setSplashFade(true), 1600);
    const t2 = setTimeout(() => setSplashGone(true), 2200);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  const dismissSplash = () => { setSplashFade(true); setTimeout(() => setSplashGone(true), 500); };

  const minsSince = Math.max(0, Math.floor((now - lastLogAt) / 60000));
  const shame = SHAME_COPY(minsSince, glasses);
  const tier = tierOf(glasses);
  const complete = glasses >= GOAL;

  const fireConfetti = () => {
    setConfetti(true);
    setTimeout(() => setConfetti(false), 3200);
  };

  const logWater = () => {
    if (glasses >= GOAL) return;
    const prevTier = tier;
    const next = glasses + 1;
    setGlasses(next);
    setLastLogAt(Date.now());
    setPulse(true);
    setRipple(true);
    setTimeout(() => setPulse(false), 850);
    setTimeout(() => setRipple(false), 720);

    // reduce coffee debt on each water log
    const willStillHaveDebt = Math.max(0, coffeeDebt - 1) > 0;
    if (coffeeDebt > 0) setCoffeeDebt(d => Math.max(0, d - 1));

    const newTier = tierOf(next);
    if (newTier > prevTier || next === GOAL) fireConfetti();

    // Auto-pop the reward modal when crossing into a media tier (2, 3, 4),
    // but only if the tier isn't still locked by coffee debt after this log.
    if (newTier > prevTier && newTier >= 2 && !willStillHaveDebt) {
      setTimeout(() => {
        setModalJustUnlocked(true);
        setModalTier(newTier);
      }, 480);
    }
  };

  const logCoffee = () => {
    setGlasses(g => Math.max(0, g - 1));
    setCoffeeDebt(d => d + 1);
    setViolationFlash(true);
    setTimeout(() => setViolationFlash(false), 1200);
  };

  const resetDay = () => {
    setGlasses(0);
    setCoffeeDebt(0);
    setLastLogAt(Date.now());
    setSettingsOpen(false);
  };

  const nextDay = () => {
    setDay(d => Math.min(14, d + 1));
    setGlasses(0);
    setCoffeeDebt(0);
    setLastLogAt(Date.now());
    setSettingsOpen(false);
  };

  return (
    <div className="min-h-screen relative" style={{ zIndex: 2 }}>
      {!splashGone && (
        <div onClick={dismissSplash}
          className="fixed inset-0 z-[200] flex flex-col items-center justify-center text-center px-8 cursor-pointer"
          style={{
            background: 'radial-gradient(120% 120% at 50% 0%, #241b2e 0%, #0D0A1A 70%)',
            opacity: splashFade ? 0 : 1,
            transition: 'opacity 0.55s ease',
          }}>
          <div className="font-mono-tight text-[11px] uppercase tracking-[0.4em] text-[color:var(--gold)] mb-3">Good Girl</div>
          <div className="font-serif-display italic text-[40px] leading-none gold-text">Hydration Protocol</div>
          <div className="mt-6 font-serif-display italic text-[20px] text-[color:var(--text-muted)]">"Stay thirsty. Stay good."</div>
          <div className="mt-10 font-mono-tight text-[10px] uppercase tracking-[0.3em] text-[color:var(--text-faint)]">tap to enter</div>
        </div>
      )}
      {/* Drifting background droplets */}
      {Array.from({ length: 14 }).map((_, i) => (
        <span key={i} className="bg-droplet"
          style={{
            left: `${(i * 73) % 100}%`,
            '--dx': `${(i % 2 === 0 ? 1 : -1) * (10 + (i * 7) % 40)}px`,
            '--dur': `${14 + (i * 3) % 18}s`,
            '--delay': `${(i * 1.7) % 12}s`,
          }} />
      ))}

      <Confetti show={confetti} />
      <WalkOfShame visible={showShame} yesterday={yesterdayScore} onDismiss={() => setShowShame(false)} />
      <RewardModal
        tier={modalTier}
        glasses={glasses}
        justUnlocked={modalJustUnlocked}
        onClose={() => setModalTier(null)}
        line={currentLine}
        visual={currentVisual}
        badge={currentBadge}
      />

      <div className="mx-auto max-w-[420px] px-5 pt-6 pb-16 relative">

        {/* HEADER */}
        <header className="flex items-start justify-between">
          <div className="flex items-start gap-3">
            <div className="w-11 h-11 rounded-xl glass-gold flex items-center justify-center shrink-0">
              <Crown size={22} />
            </div>
            <div>
              <div className="font-serif-display text-[24px] leading-[1.05] gold-text">Good Girl</div>
              <div className="font-serif-display italic text-[16px] leading-tight text-[color:var(--text-primary)]/90">Hydration Protocol</div>
              <div className="flex items-center gap-2 mt-1">
                <span className="w-1.5 h-1.5 rounded-full bg-[color:var(--success)] shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                <span className="font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-muted)]">Compliance tracking active</span>
              </div>
            </div>
          </div>
          <button
            onClick={() => setSettingsOpen(o => !o)}
            className="btn-ghost rounded-full w-9 h-9 flex items-center justify-center text-[color:var(--text-muted)]"
            aria-label="Settings"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="2" r="1.2" fill="currentColor"/>
              <circle cx="7" cy="7" r="1.2" fill="currentColor"/>
              <circle cx="7" cy="12" r="1.2" fill="currentColor"/>
            </svg>
          </button>
        </header>

        {settingsOpen && (
          <div className="glass rounded-2xl mt-3 p-3 flex items-center justify-between slide-up">
            <div>
              <div className="font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-faint)]">Day {String(day).padStart(2, '0')} / 14</div>
              <div className="text-[12px] text-[color:var(--text-muted)]">Reset today, or jump to the next set.</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={resetDay} className="btn-ghost rounded-full px-3 py-1.5 font-mono-tight text-[10px] uppercase tracking-[0.2em] text-[color:var(--text-primary)]">
                Reset
              </button>
              <button onClick={nextDay} disabled={day >= 14} className={`btn-ghost rounded-full px-3 py-1.5 font-mono-tight text-[10px] uppercase tracking-[0.2em] text-[color:var(--gold)] ${day >= 14 ? 'opacity-40 cursor-not-allowed' : ''}`}>
                Next day →
              </button>
            </div>
          </div>
        )}

        {/* RING */}
        <section className="mt-7">
          <ProgressRing value={glasses} goal={GOAL} pulsing={pulse} />

          <div className="text-center mt-4">
            {complete ? (
              <div className="font-serif-display italic text-[22px] gold-text">Protocol Complete. Good girl.</div>
            ) : (
              <div className={`text-[12px] ${TONE_CLASS[shame.tone]} font-mono-tight uppercase tracking-[0.2em]`}>
                {shame.text}
              </div>
            )}
          </div>
        </section>

        {/* ACTIONS */}
        <section className="mt-7 flex gap-3">
          <button
            onClick={logWater}
            disabled={complete}
            className={`btn-primary flex-1 rounded-2xl py-4 relative flex flex-col items-center justify-center gap-1 ${complete ? 'opacity-70' : ''}`}
          >
            {ripple && <span className="ripple" />}
            <Droplet filled size={22} />
            <span className="font-serif-display italic text-[20px] gold-text leading-none">
              {complete ? 'Goal reached' : 'Log Water'}
            </span>
            <span className="font-mono-tight text-[9px] uppercase tracking-[0.22em] text-[color:var(--text-muted)] text-center">
              {complete ? 'Rest. You earned it.' : '+1 glass · 250 ml'}
            </span>
          </button>

          <button
            onClick={logCoffee}
            className={`btn-coffee flex-1 rounded-2xl py-4 flex flex-col items-center justify-center gap-1 ${violationFlash ? 'pulse-once' : ''}`}
          >
            <span className="text-[22px]">☕</span>
            <span className="font-mono-tight text-[12px] uppercase tracking-[0.22em] text-red-300 leading-none">Log Coffee</span>
            <span className="font-mono-tight text-[9px] uppercase tracking-[0.22em] text-red-300 flex items-center gap-1">
              {coffeeDebt > 0 && <Lock size={10} />}
              {coffeeDebt > 0 ? `Debt · ${coffeeDebt}` : '−1 glass'}
            </span>
          </button>
        </section>

        {/* COFFEE DEBT PANEL */}
        {coffeeDebt > 0 && (
          <section className="mt-4">
            <div className="glass-danger rounded-2xl p-4 slide-up">
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-full border border-red-400/60 flex items-center justify-center text-red-300 shrink-0">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 1 L13 12 H1 Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
                    <path d="M7 5.5 V 8.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                    <circle cx="7" cy="10.5" r="0.7" fill="currentColor"/>
                  </svg>
                </div>
                <div className="flex-1">
                  <div className="font-mono-tight text-[10px] uppercase tracking-[0.28em] text-red-300">Violation detected</div>
                  <div className="font-serif-display text-[20px] text-[color:var(--text-primary)] leading-tight mt-0.5">
                    Coffee debt: <span className="text-red-300">{coffeeDebt} {coffeeDebt === 1 ? 'glass' : 'glasses'}</span>
                  </div>
                  <div className="text-[12px] text-[color:var(--text-muted)] mt-1">
                    Coffee privileges under review. Each glass of water reduces debt by 1.
                  </div>
                </div>
              </div>
            </div>
          </section>
        )}

        {/* REWARDS */}
        <section className="mt-6">
          <RewardZone glasses={glasses} coffeeDebt={coffeeDebt} line={currentLine} badge={currentBadge} onOpen={(t) => { setModalJustUnlocked(false); setModalTier(t); }} />
        </section>

        {/* FOOTER STATUS */}
        <footer className="mt-10 flex items-center justify-between font-mono-tight text-[10px] uppercase tracking-[0.25em] text-[color:var(--text-faint)]">
          <div>Day {String(day).padStart(2, '0')} · Protocol v1.0</div>
          <div className="flex items-center gap-1.5">
            <span className="w-1 h-1 rounded-full bg-[color:var(--text-faint)]"></span>
            <span>He is watching</span>
          </div>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
